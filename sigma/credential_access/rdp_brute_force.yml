title: RDP Brute Force - Multiple Failed Logons
id: 9b0c1d2e-3f4a-5b6c-7d8e-9f0a1b2c3d4e
status: test
description: |
    Detects multiple failed RDP logon attempts (Event 4625, LogonType 10)
    from a single source IP. Should be correlated with Event 4624
    (successful logon) to identify actual compromises.
author: fungiknight (Gabriel Lopez)
date: 2026/08/18
references:
    - https://attack.mitre.org/techniques/T1110/001/
    - https://attack.mitre.org/techniques/T1021/001/
tags:
    - attack.credential_access
    - attack.t1110.001
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
        LogonType: 10
    condition: selection | count() by IpAddress > 5
falsepositives:
    - Legitimate users mistyping RDP passwords
    - Network scanners
    - Load balancer health checks using RDP
level: medium
# --- Testing Notes ---
# From MyDFIR 30-Day Challenge:
#   Shodan shows 4M+ exposed RDP endpoints globally
#   Key finding: IP 98.116.35.167 had 9 SUCCESSFUL logons (Event 4624)
#     after initial brute force — confirmed real compromise
#   Investigation steps:
#     1. Filter 4625 by source IP → count failures
#     2. Cross-reference with 4624 for same IP → any successes?
#     3. If success found: pivot on TargetUserName + timestamp
#     4. Check for Sysmon Event 1 (process creation) after logon
#     5. Look for credential manager reads, group enumeration
