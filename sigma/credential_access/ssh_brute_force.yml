title: SSH Brute Force - Multiple Failed Authentications
id: 8a9b0c1d-2e3f-4a5b-6c7d-8e9f0a1b2c3d
status: test
description: |
    Detects multiple failed SSH authentication attempts from a single
    source, indicating a brute force attack. Threshold-based detection
    requiring 5+ failures within the default timeframe.
author: fungiknight (Gabriel Lopez)
date: 2026/08/18
references:
    - https://attack.mitre.org/techniques/T1110/001/
tags:
    - attack.credential_access
    - attack.t1110.001
logsource:
    product: linux
    service: auth
detection:
    selection:
        syslog.message|contains: 'Failed password'
    condition: selection | count() by source.ip > 5
falsepositives:
    - Legitimate users mistyping passwords multiple times
    - Automated service accounts with expired credentials
    - Vulnerability scanners
level: medium
# --- Testing Notes ---
# From MyDFIR 30-Day Challenge:
#   auth.log analysis with: grep -i failed auth.log | head
#   Key fields in Elasticsearch:
#     system.auth.ssh.event: "Failed"
#     agent.name: "MYDFIR-Linux-DITO"
#   Built alert with threshold: 5 failures in 5 minutes
#   Top attacker IP: 8.219.120.50 — checked AbuseIPDB, no compromise found
