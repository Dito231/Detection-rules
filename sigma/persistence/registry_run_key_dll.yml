title: DLL Persistence via Registry Run Key from AppData
id: 9a8b7c6d-5e4f-3a2b-1c0d-ef98dc76ba54
status: test
description: |
    Detects creation of a registry Run key that points to a DLL in
    AppData\Local. This pattern is used by Emotet and other malware
    families to persist across reboots by loading their DLL on user login.
author: fungiknight (Gabriel Lopez)
date: 2026/08/18
references:
    - https://attack.mitre.org/techniques/T1547/001/
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        EventType: SetValue
        TargetObject|contains: '\CurrentVersion\Run\'
        Details|contains:
            - '\AppData\Local\'
        Details|endswith:
            - '.dll'
    condition: selection
falsepositives:
    - Legitimate software installing DLL-based auto-start entries from AppData (uncommon)
level: high
# --- Testing Notes ---
# Tested against Emotet sample behavior:
#   Registry key: HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\[random]
#   Value: C:\Users\[user]\AppData\Local\[random]\[random].dll
#   Sysmon Event ID: 13 (Registry Value Set)
